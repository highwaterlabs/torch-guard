name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Lint torch-preflight with torch-preflight
        run: torch-preflight check src/ --fail-on warning

  # The default install must stay light: no torch, no huggingface_hub. A stray top-level
  # import would silently turn `pip install torch-preflight` into a multi-gigabyte download,
  # and the matrix above cannot catch it because it installs the dev extra.
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install with no extras
        run: python -m pip install .

      - name: Assert the heavy dependencies are absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          for name in ("torch", "huggingface_hub"):
              assert importlib.util.find_spec(name) is None, f"{name} leaked into base install"
          print("base install is clean")
          PY

      - name: Assert nothing imports them at runtime
        run: |
          python - <<'PY'
          import sys, torch_preflight
          from torch_preflight import vram
          torch_preflight.check_source("t.py", "x = 1")
          vram.estimate_script("t.py", "x = 1")
          vram.estimate_script("t.py", 'm = AutoModel.from_pretrained("gpt2")', gpu="a100-80gb")
          for name in ("torch", "huggingface_hub"):
              assert name not in sys.modules, f"{name} was imported at runtime"
          print("no optional dependency imported")
          PY

      - name: Estimator works, and its exit codes mean what we say they mean
        run: |
          set -e
          torch-preflight gpus > /dev/null

          # A run that fits must exit 0.
          torch-preflight estimate --model gpt2 --gpu a100-80gb \
            --batch-size 4 --seq-len 512 > /dev/null

          # A run that cannot fit must exit 1, because CI is meant to fail on it. A 7B
          # full fine-tune in fp32 genuinely does not fit an 80GB A100 — the first
          # version of this step used exactly that command and was surprised by it.
          if torch-preflight estimate --model llama-2-7b --gpu a100-80gb \
               --batch-size 1 --seq-len 512 > /dev/null; then
            echo "expected exit 1 for a projected OOM, got 0"; exit 1
          fi

  # Nothing in the matrix above installs torch, so the meta provider, autodetection and
  # VRAMGuard are never exercised there. This job is the only place that code runs.
  with-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install with every extra
        run: python -m pip install -e ".[dev,vram,hub]"
      - name: Test
        run: python -m pytest -q
      - name: Confirm the torch-dependent suites actually ran
        run: |
          python -m pytest -q tests/test_meta.py tests/test_guard.py \
            | tee /tmp/out.txt
          grep -qE "[0-9]+ passed" /tmp/out.txt
          grep -q "no tests ran" /tmp/out.txt && exit 1 || true

  # The hub provider's field mapping only breaks when a real config disagrees with it.
  # Offline tests replay captured configs and run in the matrix above; this job checks the
  # captured copies still match what the hub actually serves.
  hub-live:
    runs-on: ubuntu-latest
    continue-on-error: true   # an upstream outage must not block a PR
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install with the hub extra
        run: python -m pip install -e ".[dev,hub]"
      - name: Run the networked tests
        # `-m network` deselects everything else. If the hub tests ever end up in a module
        # that skips without torch, this collects nothing and pytest exits 5 — which is
        # how this job failed the first time it ran.
        run: python -m pytest -q -m network --strict-markers
