name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Test
        run: python -m pytest -q

      - name: Lint torch-guard with torch-guard
        run: torch-guard check src/ --fail-on warning

  # The default install must stay light: no torch, no huggingface_hub. A stray top-level
  # import would silently turn `pip install torch-guard` into a multi-gigabyte download,
  # and the matrix above cannot catch it because it installs the dev extra.
  base-install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install with no extras
        run: python -m pip install .

      - name: Assert the heavy dependencies are absent
        run: |
          python - <<'PY'
          import importlib.util, sys
          for name in ("torch", "huggingface_hub"):
              assert importlib.util.find_spec(name) is None, f"{name} leaked into base install"
          print("base install is clean")
          PY

      - name: Assert nothing imports them at runtime
        run: |
          python - <<'PY'
          import sys, torch_guard
          from torch_guard import vram
          torch_guard.check_source("t.py", "x = 1")
          vram.estimate_script("t.py", "x = 1")
          vram.estimate_script("t.py", 'm = AutoModel.from_pretrained("gpt2")', gpu="a100-80gb")
          for name in ("torch", "huggingface_hub"):
              assert name not in sys.modules, f"{name} was imported at runtime"
          print("no optional dependency imported")
          PY

      - name: Estimator works without any extras
        run: |
          torch-guard estimate --model llama-2-7b --gpu a100-80gb --batch-size 1 --seq-len 512
          torch-guard gpus

  # The hub provider's field mapping only breaks when a real config disagrees with it.
  # Offline tests replay captured configs and run in the matrix above; this job checks the
  # captured copies still match what the hub actually serves.
  hub-live:
    runs-on: ubuntu-latest
    continue-on-error: true   # an upstream outage must not block a PR
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install with the hub extra
        run: python -m pip install -e ".[dev,hub]"
      - name: Run the networked tests
        run: python -m pytest -q -m network
