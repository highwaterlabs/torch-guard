name: Release

# Publishes to PyPI when a v* tag is pushed. Uses Trusted Publishing (OIDC), so there is
# no API token stored anywhere — PyPI verifies the workflow identity directly.
#
# A manual run builds and checks the artifacts without publishing, so the pipeline can be
# exercised safely before a real release.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install
        run: python -m pip install -e ".[dev]" build twine

      # Publishing broken code is not recoverable: a PyPI version number can never be
      # reused, even after deletion.
      - name: Test
        run: python -m pytest -q

      - name: Lint torch-preflight with torch-preflight
        run: torch-preflight check src/ --fail-on warning

      - name: Tag must match the packaged version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          with open("pyproject.toml", "rb") as f:
              version = tomllib.load(f)["project"]["version"]
          if tag != version:
              sys.exit(f"tag v{tag} does not match pyproject version {version}")
          print(f"tag and version agree: {version}")
          PY

      - name: Build
        run: python -m build

      - name: Check metadata renders on PyPI
        run: python -m twine check --strict dist/*

      # The version check above compares the tag to pyproject, but says nothing about
      # the distribution *name*. v0.1.0 was first tagged on a commit that still packaged
      # `torch-guard`, and the mismatch only surfaced as an opaque OIDC rejection at the
      # upload step. Fail here instead, where the message is obvious.
      - name: Artifacts must be named torch-preflight
        run: |
          python - <<'PY'
          import pathlib, sys
          expected = "torch_preflight"
          wrong = [p.name for p in pathlib.Path("dist").iterdir()
                   if not p.name.startswith(expected + "-")]
          if wrong:
              sys.exit(f"expected {expected}-* in dist/, found: {wrong}")
          print("artifact names correct:", [p.name for p in pathlib.Path("dist").iterdir()])
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # A manual run skips `publish`, which is where the artifact is downloaded -- so without
  # this job a rehearsal exercises the upload and never the download, and an incompatible
  # upload/download pair would only surface during a real release, after the version number
  # is already spent. This runs on workflow_dispatch only and touches nothing outside the
  # runner.
  rehearse:
    name: Rehearse the artifact round-trip
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: The publish step must find exactly the two artifacts it expects
        run: |
          python - <<'PY'
          import pathlib, sys
          names = sorted(p.name for p in pathlib.Path("dist").iterdir())
          wheels = [n for n in names if n.endswith(".whl")]
          tarballs = [n for n in names if n.endswith(".tar.gz")]
          if len(wheels) != 1 or len(tarballs) != 1:
              sys.exit(f"expected one wheel and one sdist, found: {names}")
          print("artifact round-trip intact:", names)
          PY

  publish:
    name: Publish to PyPI
    # Only a tag publishes. A manual run stops after build and `rehearse`, so the pipeline
    # can be exercised end to end without burning a version number.
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/torch-preflight
    permissions:
      id-token: write        # required for Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  # The Action is documented as `uses: highwaterlabs/torch-preflight@v0`, which is the
  # Actions convention: users pin a floating major tag and pick up non-breaking releases.
  # That tag has to be moved on every release, and a floating tag maintained by hand is one
  # that silently goes stale -- so it is moved here, and only after `publish` succeeds, so
  # `v0` can never point at a version that failed to reach PyPI.
  major-tag:
    name: Move the floating major tag
    if: startsWith(github.ref, 'refs/tags/')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write        # required to force-move the tag
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Point v<major> at this release
        run: |
          set -euo pipefail
          full="${GITHUB_REF_NAME}"                 # e.g. v0.3.0
          major="${full%%.*}"                       # e.g. v0
          if [ "$major" = "$full" ]; then
            echo "::error::$full does not look like vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$major" "$full^{commit}"
          git push -f origin "refs/tags/$major"
          echo "$major now points at $full ($(git rev-parse --short "$full^{commit}"))"
