- id: torch-preflight
  name: torch-preflight
  description: Catch PyTorch VRAM leaks, convergence bugs and GPU stalls before commit.
  entry: torch-preflight check
  language: python
  types_or: [python, pyi]
  require_serial: false

- id: torch-preflight-fix
  name: torch-preflight (autofix)
  description: Same checks, applying the safe autofixes in place.
  entry: torch-preflight check --fix
  language: python
  types_or: [python, pyi]
  require_serial: false
