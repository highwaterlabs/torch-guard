<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="torch-preflight">
  <title>torch-preflight</title>
  <defs>
    <linearGradient id="tp-fill" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <clipPath id="tp-tank">
      <rect x="20" y="6" width="24" height="52" rx="7"/>
    </clipPath>
  </defs>

  <!-- projected usage, filling from the bottom -->
  <g clip-path="url(#tp-tank)">
    <rect x="20" y="31" width="24" height="27" fill="url(#tp-fill)"/>
  </g>

  <!-- the capacity of the device -->
  <rect x="20" y="6" width="24" height="52" rx="7"
        fill="none" stroke="#64748b" stroke-width="3"/>

  <!-- the limit: cross it and the run sinks -->
  <line x1="12" y1="21" x2="52" y2="21"
        stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
  <circle cx="12" cy="21" r="2.5" fill="#ef4444"/>
  <circle cx="52" cy="21" r="2.5" fill="#ef4444"/>
</svg>
